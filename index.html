<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#181a1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fluir">
  <meta name="description" content="A companion app for Easy Spanish Step-by-Step">

  <title>Fluir</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

  <div id="app">

    <!-- Topbar -->
    <header class="topbar">
      <a id="topbar-logo" class="topbar__logo" href="#/">fluir<span class="topbar__logo-dot">.</span></a>
      <div class="topbar__meta">
        <div class="topbar__book">Easy Spanish Step-by-Step</div>
        <div class="topbar__tagline">Companion App</div>
      </div>
    </header>

    <!-- Main content — pages render here -->
    <main id="main-content"></main>

    <!-- Bottom nav -->
    <nav class="bottom-nav" role="navigation" aria-label="Main navigation">

      <button class="nav-item active" data-route="/" aria-label="Home">
        <svg viewBox="0 0 24 24">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
          <polyline points="9 21 9 12 15 12 15 21"/>
        </svg>
        Home
      </button>

      <button class="nav-item" data-route="/training" aria-label="Practice">
        <svg viewBox="0 0 24 24">
          <path d="M6.5 6.5h1v11h-1z"/>
          <path d="M16.5 6.5h1v11h-1z"/>
          <path d="M4 8.5h3v7H4z" stroke-linejoin="round"/>
          <path d="M17 8.5h3v7h-3z" stroke-linejoin="round"/>
          <line x1="7" y1="12" x2="17" y2="12"/>
        </svg>
        Practice
      </button>

      <button class="nav-item" data-route="/progress" aria-label="Progress">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6"  y1="20" x2="6"  y2="14"/>
        </svg>
        Progress
      </button>

      <button class="nav-item" data-route="/settings" aria-label="Settings">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        Settings
      </button>

    </nav>

  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Service worker: register in production, actively clean up on localhost -->
  <script src="/js/sw-register.js"></script>

  <!-- App boot -->
  <script type="module" src="/js/app.js"></script>

</body>
</html>
